name: Actualizare cataloage

on:
  schedule:
    # Penny: marți, 18:00 UTC (rulare principală) și 22:00 UTC (reîncercare)
    - cron: "0 18 * * 2"
    - cron: "0 22 * * 2"
    # Lidl: duminică, 18:00 UTC (rulare principală) și 22:00 UTC (reîncercare)
    - cron: "0 18 * * 0"
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      store:
        description: "Magazinul de verificat"
        type: choice
        options:
          - all
          - penny
          - lidl
        default: all

permissions:
  contents: write

jobs:
  update-catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configurare Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalare dependențe
        run: pip install -r scripts/requirements.txt

      - name: Stabilire magazin
        id: store
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STORE: ${{ inputs.store }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 18 * * 2"|"0 22 * * 2") store=penny ;;
              "0 18 * * 0"|"0 22 * * 0") store=lidl ;;
              *) store=all ;;
            esac
          else
            store="${INPUT_STORE:-all}"
          fi
          echo "store=$store" >> "$GITHUB_OUTPUT"

      - name: Verificare și extragere oferte
        env:
          STORE: ${{ steps.store.outputs.store }}
        run: |
          set +e
          python scripts/fetch_catalogs.py --store "$STORE"
          code=$?
          # 0 = verificat (actualizat sau nepublicat încă); 2 = un magazin a eșuat, datele lui au fost păstrate.
          # Orice alt cod oprește jobul.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Commit și push doar dacă s-a schimbat catalogul
        env:
          STORE: ${{ steps.store.outputs.store }}
        run: |
          git diff --quiet app/src/main/assets/catalog_products.json || (
            git config user.name "github-actions[bot]" &&
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
            git add app/src/main/assets/catalog_products.json &&
            git commit -m "Actualizare cataloage: ${STORE}" -m "Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>" &&
            git push origin "HEAD:${GITHUB_REF_NAME}"
          )
